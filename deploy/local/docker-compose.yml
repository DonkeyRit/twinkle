version: '3.8'
services:
  postgres_local:
    image: postgres:latest
    environment:
      POSTGRES_USER: localuser
      POSTGRES_PASSWORD: localpassword
      POSTGRES_DB: carrent
    ports:
      - "5432:5432"
    volumes:
      - local_db_data:/var/lib/postgresql/data
  postgres_local_tests:
    image: postgres:latest
    environment:
      POSTGRES_USER: localtestuser
      POSTGRES_PASSWORD: localtestpassword
      POSTGRES_DB: carrenttests
    ports:
      - "5433:5432"
    volumes:
      - local_test_db_data:/var/lib/postgresql/data

volumes:
  local_db_data:
  local_test_db_data:

